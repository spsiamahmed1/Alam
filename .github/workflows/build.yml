name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and unzip project
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ কোনো .zip ফাইল পাওয়া যায়নি। root-এ project.zip upload করুন।"
            exit 1
          fi
          echo "📦 পাওয়া গেছে: $ZIP_FILE"
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

          if [ ! -f project/settings.gradle ] && [ ! -f project/settings.gradle.kts ]; then
            INNER=$(find project -maxdepth 2 -type f -name "settings.gradle*" | head -n 1)
            if [ -n "$INNER" ]; then
              INNER_DIR=$(dirname "$INNER")
              echo "➡️ nested folder: $INNER_DIR"
              mv "$INNER_DIR" project_tmp
              rm -rf project
              mv project_tmp project
            fi
          fi

          if [ ! -f project/settings.gradle ] && [ ! -f project/settings.gradle.kts ]; then
            echo "❌ settings.gradle পাওয়া যায়নি।"
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generate Gradle wrapper
        working-directory: project
        run: gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        working-directory: project
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModernAlarm-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
